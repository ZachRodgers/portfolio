<svg width="17" height="17" viewBox="-3 -3 17 17" fill="none" xmlns="http://www.w3.org/2000/svg" overflow="visible">
<defs>
<style>
  @keyframes jumpSpin1 {
    0%   { transform: translateY(0) rotate(0deg); }
    15%  { transform: translateY(-1.8px) rotate(0deg); }
    30%  { transform: translateY(-2.5px) rotate(45deg); }
    45%  { transform: translateY(-1.8px) rotate(90deg); }
    58%  { transform: translateY(0) rotate(90deg); }
    64%  { transform: translateY(-0.5px) rotate(90deg); }
    72%  { transform: translateY(0) rotate(90deg); }
    100% { transform: translateY(0) rotate(90deg); }
  }
  @keyframes jumpSpin2 {
    0%   { transform: translateY(0) rotate(0deg); }
    20%  { transform: translateY(0) rotate(0deg); }
    35%  { transform: translateY(-1.8px) rotate(0deg); }
    50%  { transform: translateY(-2.5px) rotate(45deg); }
    65%  { transform: translateY(-1.8px) rotate(90deg); }
    78%  { transform: translateY(0) rotate(90deg); }
    84%  { transform: translateY(-0.5px) rotate(90deg); }
    92%  { transform: translateY(0) rotate(90deg); }
    100% { transform: translateY(0) rotate(90deg); }
  }
  .square1 {
    transform-origin: 2.5px 2.5px;
    animation: jumpSpin1 0.9s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
  }
  .square2 {
    transform-origin: 8.5px 2.5px;
    animation: jumpSpin2 0.9s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
  }
</style>
