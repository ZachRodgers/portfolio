<svg width="11" height="11" viewBox="0 0 11 11" fill="none" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
<defs>
<style>
  /* Line wipe out: clip from left to right using stroke-dashoffset */
  /* Line 1 length: 6.87516 - 3.2085 = 3.66666 */
  /* Line 2 length: 7.79183 - 3.2085 = 4.58333 */
  /* Line 3 length: 5.9585 - 3.2085 = 2.75 */

  @keyframes wipeOut1 {
    0%   { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: -3.67; }
  }
  @keyframes wipeOut2 {
    0%   { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: -4.59; }
  }
  @keyframes wipeOut3 {
    0%   { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: -2.75; }
  }

  @keyframes wipeIn1 {
    0%   { stroke-dashoffset: 3.67; }
    100% { stroke-dashoffset: 0; }
  }
  @keyframes wipeIn2 {
    0%   { stroke-dashoffset: 4.59; }
    100% { stroke-dashoffset: 0; }
  }
  @keyframes wipeIn3 {
    0%   { stroke-dashoffset: 2.75; }
    100% { stroke-dashoffset: 0; }
  }

  /* Phase 1: Lines wipe out left-to-right */
  .line1-out {
    stroke-dasharray: 3.67;
    stroke-dashoffset: 0;
    animation: wipeOut1 0.25s ease-in forwards;
    animation-delay: 0s;
  }
  .line2-out {
    stroke-dasharray: 4.59;
    stroke-dashoffset: 0;
    animation: wipeOut2 0.25s ease-in forwards;
    animation-delay: 0.08s;
  }
  .line3-out {
    stroke-dasharray: 2.75;
    stroke-dashoffset: 0;
    animation: wipeOut3 0.25s ease-in forwards;
    animation-delay: 0.16s;
  }

  /* Phase 3: Lines wipe in left-to-right */
  .line1-in {
    stroke-dasharray: 3.67;
    stroke-dashoffset: 3.67;
    animation: wipeIn1 0.25s ease-out forwards;
    animation-delay: 0.65s;
  }
  .line2-in {
    stroke-dasharray: 4.59;
    stroke-dashoffset: 4.59;
    animation: wipeIn2 0.25s ease-out forwards;
    animation-delay: 0.73s;
  }
  .line3-in {
    stroke-dasharray: 2.75;
    stroke-dashoffset: 2.75;
    animation: wipeIn3 0.25s ease-out forwards;
    animation-delay: 0.81s;
  }

  /* Phase 2: Brackets squeeze */
  @keyframes bracketSqueezeTopLeft {
    0%   { transform: translate(0, 0); }
    40%  { transform: translate(0.6px, 0.6px); }
    70%  { transform: translate(0, 0); }
    100% { transform: translate(0, 0); }
  }
  @keyframes bracketSqueezeTopRight {
    0%   { transform: translate(0, 0); }
    40%  { transform: translate(-0.6px, 0.6px); }
    70%  { transform: translate(0, 0); }
    100% { transform: translate(0, 0); }
  }
  @keyframes bracketSqueezeBottomRight {
    0%   { transform: translate(0, 0); }
    40%  { transform: translate(-0.6px, -0.6px); }
    70%  { transform: translate(0, 0); }
    100% { transform: translate(0, 0); }
  }
  @keyframes bracketSqueezeBottomLeft {
    0%   { transform: translate(0, 0); }
    40%  { transform: translate(0.6px, -0.6px); }
    70%  { transform: translate(0, 0); }
    100% { transform: translate(0, 0); }
  }

  .bracket-tl { animation: bracketSqueezeTopLeft 0.4s ease-in-out forwards; animation-delay: 0.35s; }
  .bracket-tr { animation: bracketSqueezeTopRight 0.4s ease-in-out forwards; animation-delay: 0.35s; }
  .bracket-br { animation: bracketSqueezeBottomRight 0.4s ease-in-out forwards; animation-delay: 0.35s; }
  .bracket-bl { animation: bracketSqueezeBottomLeft 0.4s ease-in-out forwards; animation-delay: 0.35s; }
</style>
<clipPath id="clip0_alpr">
  <rect width="11" height="11" fill="white"/>
</clipPath>
</defs>
<g clip-path="url(#clip0_alpr)">
  <!-- Corner brackets -->
  <path class="bracket-tl" d="M1.375 3.20833V2.29167C1.375 2.04855 1.47158 1.81539 1.64349 1.64349C1.81539 1.47158 2.04855 1.375 2.29167 1.375H3.20833" stroke="#333333" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="bracket-tr" d="M7.7915 1.375H8.70817C8.95129 1.375 9.18444 1.47158 9.35635 1.64349C9.52826 1.81539 9.62484 2.04855 9.62484 2.29167V3.20833" stroke="#333333" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="bracket-br" d="M9.62484 7.79169V8.70835C9.62484 8.95147 9.52826 9.18463 9.35635 9.35653C9.18444 9.52844 8.95129 9.62502 8.70817 9.62502H7.7915" stroke="#333333" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="bracket-bl" d="M3.20833 9.62502H2.29167C2.04855 9.62502 1.81539 9.52844 1.64349 9.35653C1.47158 9.18463 1.375 8.95147 1.375 8.70835V7.79169" stroke="#333333" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lines: wipe out (left to right disappear) -->
  <path class="line1-out" d="M3.2085 3.66669H6.87516" stroke="#333333" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line2-out" d="M3.2085 5.5H7.79183" stroke="#333333" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line3-out" d="M3.2085 7.33331H5.9585" stroke="#333333" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lines: wipe in (left to right appear) -->
  <path class="line1-in" d="M3.2085 3.66669H6.87516" stroke="#333333" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line2-in" d="M3.2085 5.5H7.79183" stroke="#333333" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line3-in" d="M3.2085 7.33331H5.9585" stroke="#333333" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>