<svg width="11" height="11" viewBox="0 0 11 11" fill="none" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
<defs>
<style>
  /* Wipe out: scale to 0 from right edge (left disappears first) */
  @keyframes wipeOutStripe {
    0%   { transform: scaleX(1); }
    100% { transform: scaleX(0); }
  }
  /* Wipe in: scale from 0 to 1 from left edge */
  @keyframes wipeInStripe {
    0%   { transform: scaleX(0); }
    100% { transform: scaleX(1); }
  }
  /* Fade out for the dot since it is tiny */
  @keyframes fadeOut {
    0%   { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes fadeIn {
    0%   { opacity: 0; }
    100% { opacity: 1; }
  }

  /* Phase 1: wipe out left-to-right, staggered */
  .stripe-out {
    transform-origin: 9.5px 4px;
    animation: wipeOutStripe 0.2s ease-in forwards;
    animation-delay: 0s;
  }
  .pill-left-out {
    transform-origin: 3.5px 7.5px;
    animation: wipeOutStripe 0.15s ease-in forwards;
    animation-delay: 0.08s;
  }
  .dot-out {
    transform-origin: 4.5px 7.5px;
    animation: fadeOut 0.1s ease-in forwards;
    animation-delay: 0.15s;
  }
  .pill-right-out {
    transform-origin: 9.5px 7.5px;
    animation: wipeOutStripe 0.2s ease-in forwards;
    animation-delay: 0.18s;
  }

  /* Phase 2: wipe in left-to-right, staggered */
  .stripe-in {
    transform-origin: 5px 4px;
    transform: scaleX(0);
    animation: wipeInStripe 0.2s ease-out forwards;
    animation-delay: 0.55s;
  }
  .pill-left-in {
    transform-origin: 1.5px 7.5px;
    transform: scaleX(0);
    animation: wipeInStripe 0.15s ease-out forwards;
    animation-delay: 0.63s;
  }
  .dot-in {
    opacity: 0;
    animation: fadeIn 0.1s ease-out forwards;
    animation-delay: 0.7s;
  }
  .pill-right-in {
    transform-origin: 5.5px 7.5px;
    transform: scaleX(0);
    animation: wipeInStripe 0.2s ease-out forwards;
    animation-delay: 0.73s;
  }
</style>
</defs>
<!-- Card outline (stays still) -->
