<path class="dot-out" d="M4 7.5C4 7.22386 4.22386 7 4.5 7C4.77614 7 5 7.22386 5 7.5C5 7.77614 4.77614 8 4.5 8C4.22386 8 4 7.77614 4 7.5Z" fill="#333333"/>
<path class="pill-right-out" d="M5.5 7.5C5.5 7.22386 5.72386 7 6 7H9C9.27614 7 9.5 7.22386 9.5 7.5C9.5 7.77614 9.27614 8 9 8H6C5.72386 8 5.5 7.77614 5.5 7.5Z" fill="#333333"/>

<!-- Wipe in versions -->
<path class="stripe-in" d="M5 3.6C5 3.54477 5.04477 3.5 5.1 3.5H9.4C9.45523 3.5 9.5 3.54477 9.5 3.6V4.4C9.5 4.45523 9.45523 4.5 9.4 4.5H5.1C5.04477 4.5 5 4.45523 5 4.4V3.6Z" fill="#333333"/>
<path class="pill-left-in" d="M1.5 7.5C1.5 7.22386 1.72386 7 2 7H3C3.27614 7 3.5 7.22386 3.5 7.5C3.5 7.77614 3.27614 8 3 8H2C1.72386 8 1.5 7.77614 1.5 7.5Z" fill="#333333"/>
<path class="dot-in" d="M4 7.5C4 7.22386 4.22386 7 4.5 7C4.77614 7 5 7.22386 5 7.5C5 7.77614 4.77614 8 4.5 8C4.22386 8 4 7.77614 4 7.5Z" fill="#333333"/>
<path class="pill-right-in" d="M5.5 7.5C5.5 7.22386 5.72386 7 6 7H9C9.27614 7 9.5 7.22386 9.5 7.5C9.5 7.77614 9.27614 8 9 8H6C5.72386 8 5.5 7.77614 5.5 7.5Z" fill="#333333"/>
</svg>