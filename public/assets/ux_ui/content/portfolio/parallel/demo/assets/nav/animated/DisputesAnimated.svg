    <path d="M7.3335 7.33331L10.0835 4.58331" stroke="#333333" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M9.85417 4.81248L6.1875 1.14581" stroke="#333333" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M3.6665 3.66669L6.4165 0.916687" stroke="#333333" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M3.896 3.4375L7.56266 7.10417" stroke="#333333" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</g>
</svg>