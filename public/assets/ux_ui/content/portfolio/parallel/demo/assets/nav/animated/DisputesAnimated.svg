<svg width="11" height="11" viewBox="0 0 11 11" fill="none" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
<defs>
<style>
  @keyframes gavelBang {
    /* Rest */
    0%   { transform: translate(0px, 0px) rotate(0deg); }

    /* First hit: lift up-left and tilt back */
    15%  { transform: translate(-1.8px, -1.8px) rotate(-30deg); }
    /* SLAM down fast - overshoot slightly past rest */
    23%  { transform: translate(0.3px, 0.3px) rotate(3deg); }
    /* Sharp rebound */
    27%  { transform: translate(-0.3px, -0.3px) rotate(-3deg); }
    /* Settle */
    32%  { transform: translate(0px, 0px) rotate(0deg); }

    /* Brief pause */
    38%  { transform: translate(0px, 0px) rotate(0deg); }

    /* Second hit: slightly smaller lift */
    50%  { transform: translate(-1.4px, -1.4px) rotate(-25deg); }
    /* SLAM */
    57%  { transform: translate(0.2px, 0.2px) rotate(2deg); }
    /* Tiny rebound */
    61%  { transform: translate(-0.15px, -0.15px) rotate(-1.5deg); }
    /* Settle */
    66%  { transform: translate(0px, 0px) rotate(0deg); }

    /* Hold at rest */
    100% { transform: translate(0px, 0px) rotate(0deg); }
  }
  .gavel {
    transform-origin: 5.7px 5.1px;
    animation: gavelBang 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
  }
</style>
<clipPath id="clip0_gavel">
  <rect width="11" height="11" fill="white"/>
</clipPath>
</defs>
<g >
  <g class="gavel">
