<svg width="11" height="11" viewBox="0 0 11 11" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes bellSwing {
        0%   { transform: rotate(0deg); }
        12%  { transform: rotate(15deg); }
        28%  { transform: rotate(-11deg); }
        42%  { transform: rotate(7deg); }
        56%  { transform: rotate(-4deg); }
        70%  { transform: rotate(2deg); }
        84%  { transform: rotate(-0.8deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes clapperSwing {
        0%   { transform: rotate(0deg); }
        8%   { transform: rotate(-5deg); }
        18%  { transform: rotate(20deg); }
        32%  { transform: rotate(-15deg); }
        46%  { transform: rotate(10deg); }
        60%  { transform: rotate(-6deg); }
        74%  { transform: rotate(3deg); }
        88%  { transform: rotate(-1deg); }
        100% { transform: rotate(0deg); }
      }
      .bell-body {
        transform-origin: 5.5px 0px;
        animation: bellSwing 0.8s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
      }
      .bell-clapper {
        transform-origin: 5.5px 9px;
        animation: clapperSwing 0.8s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
      }
    </style>
  </defs>

